# Disable file system watching on Windows which aggressively locks class and build directories
org.gradle.vfs.watch=false

# Keep memory caches within daemon without locking file handles
org.gradle.jvmargs=-Xmx2048m -Dsun.io.useCanonCaches=false -Dsun.zip.disableMemoryMapping=true -XX:+TieredCompilation -XX:TieredStopAtLevel=1

# Enable parallel execution and configuration caching safely
org.gradle.parallel=true
org.gradle.caching=true