spring:
  application:
    name: rose-and-key-concierge
  datasource:
    url: jdbc:postgresql://localhost:5432/rose_and_key_db
    username: postgres
    password: postgres_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080